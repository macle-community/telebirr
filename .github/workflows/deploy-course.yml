name: Deploy course website

on:
  push:
    branches:
      - main
      - course/macle-telebirr-masterclass
    paths:
      - "master-class/README.md"
      - "master-class/course-materials/lessons/**"
      - "master-class/site/**"
      - ".github/workflows/deploy-course.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Include lesson manuscripts
        run: |
          mkdir -p master-class/site/lessons
          cp master-class/course-materials/lessons/day-*.md master-class/site/lessons/
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: master-class/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
